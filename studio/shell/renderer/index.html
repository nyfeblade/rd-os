<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'self'"
    />
    <title>AI Coding Studio</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-host="preview">
    <div class="frame" role="application" aria-label="AI Coding Studio">
      <header class="bar">
        <div class="name">Studio</div>
        <button type="button" class="bar-btn" id="btn-code" aria-pressed="false">Code</button>
        <div class="tray" id="connectors-tray" aria-label="Connectors"></div>
        <div class="right">
          <button type="button" class="whisper" id="presence-btn" aria-expanded="false" aria-controls="presence-list">
            <span class="dot" aria-hidden="true"></span>
            <span id="presence-count">0 here</span>
          </button>
          <div class="popover" id="presence-list" hidden role="list"></div>
        </div>
      </header>

      <main class="main" id="main">
        <section class="pane" data-pane="chat" id="pane-chat" aria-label="Chat">
          <div class="label">Chat</div>
          <div class="chat-body">
            <aside class="seats" id="seat-list" aria-label="Seats and rooms"></aside>
            <div class="thread">
              <div class="msgs" id="messages" aria-live="polite"></div>
              <p class="open-code-hint" id="open-code-hint">
                Need the repo? <button type="button" id="hint-code">Open code</button>
              </p>
              <form class="composer" id="composer">
                <div class="composer-box">
                  <textarea id="composer-input" rows="2" placeholder="Message Eng Lead…" aria-label="Message"></textarea>
                  <button class="send" type="submit">Send</button>
                </div>
              </form>
            </div>
          </div>
        </section>

        <section class="pane code-pane" data-pane="code" id="pane-code" aria-label="Code" hidden>
          <div class="label">
            Code
            <button class="code-close" type="button" id="btn-close" aria-label="Close code">Close</button>
          </div>
          <div class="code-top"><strong>nyfeblade/rd-os</strong> · main</div>
          <div class="code-split">
            <nav class="tree" id="file-tree" aria-label="Repository files"></nav>
            <div class="editor">
              <div class="filetab" id="editor-tab"><b>StudioShell.tsx</b></div>
              <pre id="editor-body"></pre>
            </div>
          </div>
        </section>

        <section class="pane" data-pane="board" id="pane-board" aria-label="Board">
          <div class="label">Board</div>
          <div class="instruments" id="instruments" aria-label="CloudAgent and Proof"></div>
          <div class="board" id="board-body"></div>
        </section>
      </main>
    </div>

    <div class="sheet" id="cutover-sheet" hidden>
      <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="cutover-title">
        <h2 id="cutover-title">Connect seat</h2>
        <p id="cutover-copy">This seat works in Studio only while connected.</p>
        <div class="dialog-actions">
          <button type="button" class="no" id="cutover-cancel">Cancel</button>
          <button type="button" class="go" id="cutover-confirm">Connect</button>
        </div>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
