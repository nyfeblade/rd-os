name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install root deps
        run: npm ci

      - name: Root MCP smoke
        run: npm run mcp-smoke

      - name: Studio module tests (zero-dependency)
        run: |
          set -e
          for d in auth chat-engine chrome-craft github hitl marketplace mcp modes seats sfx-engine; do
            echo "::group::studio/$d"
            npm --prefix "studio/$d" test
            echo "::endgroup::"
          done

      - name: Consumer tests
        run: |
          set -e
          npm --prefix consumers/cursor-mcp test
          npm --prefix consumers/llm-complete test

      - name: Shell deps + prove suite
        working-directory: studio/shell
        run: |
          npm ci
          npm test

      - name: Packaging recipe smoke
        working-directory: studio/packaging
        run: |
          npm ci
          npm test
