[package]
name = "rdos-desktop"
version = "0.1.0"
description = "R&D OS desktop shell — greyscale Waiting view over attention.dump"
authors = ["R&D OS"]
edition = "2021"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
